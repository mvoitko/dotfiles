# TPM plugin (make sure you have these two somewhere)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'darko-mesaros/aws-tmux'
set -g @plugin "tony-sol/tmux-kubectx"
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -ga update-environment "AWS_PROFILE AWS_REGION AWS_DEFAULT_REGION"
set -g status-right "#[fg=colour239,bg=colour214] Profile: \#{aws_profile}  Region: \#{aws_region}  CLI: v.\#{aws_version}  SSO: \#{aws_sso_session} "
set -g @kubectx-format "%{context}/%{user}@%{cluster}:%{namespace}"
set -g @prefix_highlight_fg 'white' # default is 'colour231'
set -g @prefix_highlight_bg 'blue'  # default is 'colour04'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold' # default is 'fg=default,bg=yellow'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green' # default is 'fg=default,bg=yellow'

# Update session status every 5 s. Handy for aws-tmux
set -g status-interval 5
set -g status-right-length 120

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf


# Run local aws-tmux plugin (symlinked until PR is merged upstream)
run '~/.tmux/plugins/aws-tmux/aws.tmux'

# TPM must be at the very bottom
run '~/.tmux/plugins/tpm/tpm'
