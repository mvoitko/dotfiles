- defaults:
    link:
      relink: true
      create: true

- clean: ['~', '~/.config']

- create:
    - ~/.config/zsh
    - ~/.config/ghostty
    - ~/.config/karabiner
    - ~/.config/tmux
    - ~/.local/bin

- link:
    # Shell
    ~/.zshrc:
      path: shell/zshrc
      force: true
    ~/.config/zsh/aliases.zsh: shell/zsh/aliases.zsh
    ~/.config/zsh/exports.zsh: shell/zsh/exports.zsh
    ~/.config/zsh/functions.zsh: shell/zsh/functions.zsh
    ~/.config/zsh/keybindings.zsh: shell/zsh/keybindings.zsh
    ~/.config/zsh/completions.zsh: shell/zsh/completions.zsh
    ~/.config/zsh/plugins.zsh: shell/zsh/plugins.zsh
    ~/.config/starship.toml:
      path: shell/starship.toml
      force: true

    # Git
    ~/.gitconfig:
      path: git/gitconfig
      force: true
    ~/.gitignore_global: git/gitignore_global

    # SSH
    ~/.ssh/config:
      path: ssh/config
      force: true

    # Terminal
    ~/.config/ghostty/config: terminal/ghostty/config
    ~/.tmux.conf:
      path: terminal/tmux/tmux.conf
      force: true
    ~/.config/tmux/tmux.conf.local:
      path: terminal/tmux/tmux.conf.local
      force: true

    # Editor
    ~/.editorconfig: .editorconfig
    ~/Library/Application Support/Sublime Text/Packages/User/Preferences.sublime-settings:
      path: editor/sublime/Preferences.sublime-settings
      create: true
      force: true
    ~/Library/Application Support/Code/User/settings.json:
      path: editor/vscode/settings.json
      create: true
      force: true
    ~/Library/Application Support/Code/User/keybindings.json:
      path: editor/vscode/keybindings.json
      create: true

    # Window Management
    ~/.aerospace.toml: wm/aerospace.toml

    # Keyboard
    ~/.config/karabiner/karabiner.json:
      path: keyboard/karabiner/karabiner.json
      force: true

    # Claude Code
    ~/.claude/settings.json:
      path: claude/settings.json
      force: true
    ~/.claude/statusline-command.sh:
      path: claude/statusline-command.sh
      force: true
    ~/.claude/hooks/notification-sound.sh: claude/hooks/notification-sound.sh
    ~/.claude/sounds/icq-uh-oh.mp3: claude/sounds/icq-uh-oh.mp3
    ~/.claude/plugins/writing-council:
      path: claude/plugins/writing-council
      force: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
